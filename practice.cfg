// Start a local practice map and join a team, then run "exec practice".
// The round restarts once so you receive the practice money and grenades.
sv_cheats 1
sv_infinite_ammo 2             // Unlimited reserve ammo. You still need to reload.
ammo_grenade_limit_total 5
mp_freezetime 0
mp_roundtime 60                // Round length in minutes.
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_limitteams 0
mp_autoteambalance 0
mp_maxmoney 60000
mp_startmoney 60000
mp_buytime 9999                // Keep the buy menu available throughout the round.
mp_buy_anywhere 1
bot_kick
mp_warmup_end

// Spawn with five grenades. The fire grenade depends on your team.
mp_ct_default_grenades "weapon_hegrenade weapon_flashbang weapon_smokegrenade weapon_incgrenade weapon_decoy"
mp_t_default_grenades "weapon_hegrenade weapon_flashbang weapon_smokegrenade weapon_molotov weapon_decoy"

// Watch the grenade land in a preview window. Its flight path stays visible for 8 seconds.
sv_grenade_trajectory_prac_trailtime 8
sv_grenade_trajectory_prac_pipreview 1
sv_showimpacts_time 10         // How long bullet markers stay visible when F6 is enabled.
bind "F4" "toggle sv_grenade_trajectory_prac_trailtime 0 8"
bind "F5" "sv_rethrow_last_grenade"
bind "F6" "toggle sv_showimpacts 0 1"             // Red marks client impacts. Blue marks server impacts.
bind "F7" "toggle sv_showimpacts_penetration 0 1" // Show what happens when a bullet passes through a surface.
bind "F8" "toggle sv_grenade_trajectory_prac_pipreview 0 1"

bind "j" "toggle fov_cs_debug 0 30" // Zoom in to inspect a lineup. Press again for normal FOV.
bind "x" "noclip"                   // Fly through the map to inspect where a grenade landed.
bind "-" "toggle sv_cheats 0 1"
bind "[" "give weapon_flashbang"
bind "]" "cl_removedecals"          // Clear marks from the entity under your crosshair.
bind "," "bot_add_ct"
bind "." "bot_add_t"
bind "p" "bot_place"                // Aim at a spot to move an existing bot there.
bind "k" "bot_kick"

// Optional workshop shortcuts from the CS:GO config. Uncomment only for maps that implement them.
// bind "LEFTARROW" "prev"
// bind "UPARROW" "say help"
// bind "RIGHTARROW" "skip"
// bind "DOWNARROW" "back"

// Run before leaving practice to restore this repository's normal controls.
alias practice_end "sv_cheats 1; fov_cs_debug 0; noclip 0; disconnect; unbind [; unbind ]; unbind p; unbind k; bind , buyammo1; exec autoexec"
mp_restartgame 1
echo "svyatov practice.cfg loaded"
