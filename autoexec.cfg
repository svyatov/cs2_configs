// svyatov's Counter-Strike 2 config. Install in game/csgo/cfg/autoexec.cfg.
// Checked 2026-11-27 against the game data in SteamDatabase/GameTracking-CS2.
// In the console, run "exec autoexec" to reload. The last line prints a confirmation.

con_enable 1
gameinstructor_enable 0
cl_autohelp 0
cl_use_opens_buy_menu 0         // E interacts. X opens the buy menu.
mm_dedicated_search_maxping 50  // Preferred matchmaking ping limit, in milliseconds.
rate 786432                    // Retain the old receive bandwidth setting, in bytes/sec.
fps_max 999
fps_max_ui 144                 // Separate frame cap for menus.
r_drawtracers_firstperson 1
viewmodel_presetpos 2          // Classic weapon position (preset 3 in CS:GO).
zoom_sensitivity_ratio 0.818933027098955175 // Multiplier applied while scoped.

// Static four-bar crosshair. CS2 now measures its bars and gap in pixels.
// Approximation for 1080p: old length 1.5, minimum thickness, gap -1.
cl_crosshairstyle 4
cl_crosshair_thickness 1
cl_crosshairdot 0
cl_crosshair_t 0
cl_crosshair_recoil 0          // Keep the crosshair fixed during a spray.
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 127
cl_crosshaircolor_a 200        // Opacity, from 0 to 255.
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_friendly_warning 1
cl_crosshair_sniper_width 1
cl_sniper_show_inaccuracy 0

// Hold Z to extend the bars before pulling a grenade pin. Release to restore.
// The release alias also sets the normal bar length, gap and full outline at startup.
alias +nadecrosshair "cl_crosshair_length 255; cl_crosshair_gap 0; cl_crosshair_drawoutline 0"
alias -nadecrosshair "cl_crosshair_length 3; cl_crosshair_gap 3; cl_crosshair_drawoutline 1"
-nadecrosshair
bind "z" "+nadecrosshair"
cl_grenadecrosshair_smoke 1
cl_grenadecrosshairdelay_smoke 0 // Show the native full-screen guide as soon as the smoke pin is pulled.

// HUD and radar
hud_showtargetid 1
cl_teamcounter_playercount_instead_of_avatars 1
cl_teammate_colors_show 1      // Distinct colors, without letters (the final setting in the old file).
cl_teamid_overhead_mode 3      // Show teammate markers, names and equipment.
cl_showloadout 1               // Keep weapon slots visible.
safezonex 1
safezoney 1
cl_hud_radar_scale 1           // Size of the radar panel.
cl_radar_scale 0.3             // Map zoom inside the panel.
cl_radar_scale_dynamic 0       // Keep that zoom fixed as players move.
cl_radar_always_centered 0     // Let the map shift near its edges to show more playable space.
cl_radar_icon_scale_min 1      // Keep icons legible at low zoom.
cl_radar_square_with_scoreboard 1

// Modern net_graph replacement. Show warnings normally and full readings while Tab is held.
// Period switches the normal view between warnings and full readings.
alias telemetry_warn "cl_hud_telemetry_frametime_show 1; cl_hud_telemetry_ping_show 1; cl_hud_telemetry_net_misdelivery_show 1"
alias telemetry_full "cl_hud_telemetry_frametime_show 2; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2"
alias telemetry_pin "telemetry_full; alias telemetry_restore telemetry_full; alias telemetry_toggle telemetry_unpin"
alias telemetry_unpin "telemetry_warn; alias telemetry_restore telemetry_warn; alias telemetry_toggle telemetry_pin"
telemetry_unpin
alias +scores "+showscores; telemetry_full"
alias -scores "-showscores; telemetry_restore"
bind "TAB" "+scores"
bind "." "telemetry_toggle"

// Audio. Keep the ten-second warning and MVP cue audible.
snd_tensecondwarning_volume 0.15
snd_mvp_volume 0.15
snd_mute_mvp_music_live_players 1 // Silence the MVP anthem while players on both teams are still alive.
snd_menumusic_volume 0
snd_deathcamera_volume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_mapobjective_volume 0
snd_voipvolume 0.35            // Other players' voice volume.

// Buy by weapon name. A weapon must be equipped in that team's loadout.
// Keypad 5 buys the AK-47 on T and the M4A1-S on CT.
bind "KP_7" "buy ssg08"
bind "KP_8" "buy awp"
bind "KP_9" "buy g3sg1; buy scar20"
bind "KP_4" "buy galilar; buy famas"
bind "KP_5" "buy ak47; buy m4a1_silencer"
bind "KP_6" "buy sg556; buy aug"
bind "KP_1" "buy nova"
bind "KP_2" "buy xm1014"
bind "KP_3" "buy sawedoff; buy mag7"
bind "KP_0" "buy p250"
bind "KP_DEL" "buy mac10; buy mp9" // Decimal key.
bind "KP_DIVIDE" "buy decoy"
bind "KP_MULTIPLY" "buy smokegrenade"
bind "KP_MINUS" "buy flashbang"
bind "KP_PLUS" "buy hegrenade"
bind "KP_ENTER" "buy incgrenade; buy molotov"
bind "PGUP" "buy deagle"
bind "PGDN" "buy tec9; buy fiveseven"
bind "LEFTARROW" "buy vesthelm; buy vest" // Try armor and helmet first, then armor alone.
bind "RIGHTARROW" "buy defuser"
bind "UPARROW" "buy flashbang; buy flashbang; buy hegrenade; buy smokegrenade"
bind "DOWNARROW" "buy flashbang; buy incgrenade; buy molotov; buy hegrenade; buy smokegrenade"

// Movement and communication. Throw grenades manually on Valve servers.
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SPACE" "+jump"
bind "CAPSLOCK" "+duck"
bind "e" "+use"
bind "q" "lastinv"             // Previous weapon, replacing the old jump-throw macro.
bind "ALT" "+voicerecord"      // Hold left Alt (Option on an Apple keyboard) to talk.
bind "INS" "voice_modenable_toggle"
// DEL keeps CS2's refund shortcut. Use the scoreboard to mute an individual player.
bind "F1" "clutch_mode_toggle" // Temporarily silence teammates during a clutch.
unbind "F2"
bind "F3" "needbackup"
bind "F4" "thanks"
bind "F5" "cheer"
bind "F6" "compliment"
bind "F7" "roger"
bind "F8" "negative"
unbind "F9"
bind "F10" "disconnect"        // Leave the server immediately.
bind "j" "radio"
bind "l" "callvote"

// Equipment. The knife is the wheel fallback if the requested gun slot is empty.
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "player_ping"
bind "MOUSE4" "slot7"          // Flashbang.
bind "MOUSE5" "slot8"          // Smoke.
bind "MWHEELUP" "slot3; slot1"
bind "MWHEELDOWN" "slot3; slot2"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot6"               // HE grenade.
bind "5" "slot5"               // C4.
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot9"               // Decoy.
bind "v" "slot10"              // Molotov or incendiary.
bind "c" "slot12"              // Healthshot, when available.
bind "t" "+spray_menu"
bind "x" "buymenu"
bind "f" "+lookatweapon"
bind "g" "drop"
// Press B to select the knife, then C4 if carried. Release to drop and return to a gun.
alias +dropbomb "slot3; slot5"
alias -dropbomb "drop; slot2; slot1"
bind "b" "+dropbomb"

bind "/" "exec autoexec"
bind "-" "demo_timescale 1"    // Normal demo playback.
bind "=" "demo_timescale 1000" // Fast-forward a demo.
echo "svyatov autoexec.cfg loaded"
